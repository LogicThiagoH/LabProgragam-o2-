<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Introdução a formulários</h1>
    <div class="conteudo-formulario">
        <form>
        <label for="Nome">Nome:</label>
        <input type="text" name="Nome" id="Nome" size="20" maxlength="20" placeholder="Seu nome">
        <label for="Sobrenome">Sobrenome:</label> 
        <input type="text" name="Sobrenome" id="Sobrenome" placeholder="Seu sobrenome">
        <h3>Selecione seu Curso</h3>
        <input type="radio" name="Curso" id="TINF">
        <label for="TINF">Informática</label>
        <input type="radio" name="Curso" id="TCON">
        <label for="TCON">Contabilidade</label>
        <input type="radio" name="Curso" id="TADN">
        <label for="TADM">Administração</label>
        <input type="radio" name="Curso" id="TELE">
        <label for="TELE">Eletrônica</label>

        <h3>Dados</h3>
        <label for="Email">Email</label>
        <input type="email" id="Email" placeholder="Seu Email">
        <label for="Senha">Senha:</label>
        <input type="password" id="Senha" placeholder="Sua senha">
        
        <div class="conteudo-disciplina">
            <h3>Escolha a disciplinas favoritas</h3>
            <input type="checkbox" id="port"><label for="port">Português</label>
           <input type="checkbox" id="mat"><label for="mat">Matemática</label>
           <input type="checkbox" id="1p2"><label for="1p2">Lab Programação II</label>

        </div>

        <div class="conteudo-ano">
            <h3>Escolha o ano cursado</h3>
            <select>
                <option value="1">1º Ano</option>
                 <option value="2">2º Ano</option>
                  <option value="3">3º Ano</option>
                </select>
        </div>
        <p>Digite sua mensagem:</p>
        <textarea rows="10" cols="60"></textarea>
        <br>
        <button onclick="alert('teste')">Enviar dados</button>


        </form>
    </div>
</body>
</html>
